<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>多國語言學習平台 | Language Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background-color: #121316;
      color: #f3f4f6;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: #1b1d22;
      border-bottom: 1px solid #2e323b;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand {
      font-size: 1.05rem;
      font-weight: 700;
      color: #f59e0b;
    }
    nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .tab-btn {
      background: #262930;
      color: #d1d5db;
      border: 1px solid #373b44;
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.92rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .tab-btn:hover {
      background: #323640;
      color: #ffffff;
    }
    .tab-btn.active {
      background: #f59e0b;
      color: #121316;
      border-color: #f59e0b;
    }
    iframe {
      flex: 1;
      width: 100%;
      border: none;
      background: #121316;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">🌐 Language Hub</div>
    <nav>
      <button class="tab-btn active" onclick="switchTab(this, 'korean/index.html')">🇰🇷 Korean</button>
      <button class="tab-btn" onclick="switchTab(this, 'japanese/index.html')">🇯🇵 Japanese</button>
      <button class="tab-btn" onclick="switchTab(this, 'spanish/index.html')">🇪🇸 Spanish</button>
    </nav>
  </header>

  <iframe id="content-frame" src="korean/index.html" title="語言學習內容區"></iframe>

  <script>
    function switchTab(btn, url) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('content-frame').src = url;
    }
  </script>

</body>
</html>
