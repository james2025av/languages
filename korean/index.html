<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>韓文學習目錄</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background: #14161b;
      color: #f3f4f6;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .catalog-bar {
      background: #1d2028;
      border-bottom: 1px solid #2f3441;
      padding: 12px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .catalog-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .catalog-title { font-size: 0.95rem; font-weight: 700; color: #fbbf24; }
    .open-direct {
      font-size: 0.82rem;
      color: #93c5fd;
      text-decoration: none;
      border: 1px solid #374151;
      padding: 4px 10px;
      border-radius: 6px;
      background: #252934;
    }
    .lesson-list { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .lesson-btn {
      background: #262a34;
      color: #d1d5db;
      border: 1px solid #393f4d;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.88rem;
      white-space: nowrap;
    }
    .lesson-btn.active { background: #fbbf24; color: #14161b; border-color: #fbbf24; font-weight: 700; }
    .reader-frame { flex: 1; width: 100%; border: none; background: #14161b; }
  </style>
</head>
<body>
  <div class="catalog-bar">
    <div class="catalog-top">
      <div class="catalog-title">🇰🇷 韓文課文與筆記目錄</div>
      <a id="direct-link" class="open-direct" href="story-01.html" target="_blank" rel="noopener">在新視窗開啟此篇 ↗</a>
    </div>
    <div class="lesson-list">
      <button class="lesson-btn active" onclick="selectLesson(this, 'story-01.html')">01. 한밤중의 온기（深夜的餘溫）</button>
      <button class="lesson-btn" onclick="selectLesson(this, 'phrases-01.html')">02. 韓文實用短句與連音文法大全</button>
    </div>
  </div>

  <iframe id="lesson-frame" class="reader-frame" src="story-01.html" title="韓文課文閱讀區"></iframe>

  <script>
    function selectLesson(btn, fileName) {
      document.querySelectorAll('.lesson-btn').forEach(el => el.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('lesson-frame').src = fileName;
      document.getElementById('direct-link').href = fileName;
    }
  </script>
</body>
</html>
