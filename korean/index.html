        exampleZh: "那是一個安靜下著雨的週五夜晚。",

      },
      {
        id: "g3",
        badge: "文法 03",
        pattern: "-(으)며",
        title: "動作同時進行連接詞尾",

        exampleKr: "민수가 지은의 손을 부드럽게 잡으며 말했어요.",

        explanation: "用來連接同一個主語「同時進行的兩個動作」，相當於中文的「一邊……一邊……／……並同時……」。詞幹有收音時接 -으며（잡다 → 잡으며，連音唸成 [자브며]）；無收音時直接接 -며（넘겨주다 → 넘겨주며）。"
      },
      {
        id: "g4",
        badge: "文法 04",
        pattern: "-는 동안 & -아/어 가다",

        formula: "動詞詞幹 ＋ -는 동안（在……期間）｜ 動詞／形容詞詞幹 ＋ -아/어 가다（漸漸……）",
        matchTexts: ["밤이 깊어 갔어요", "창문을 두드리는 동안"],
        exampleKr: "빗소리가 창문을 두드리는 동안, 밤이 깊어 갔어요.",
        examplePron: "[빋쏘리가 창무늘 두드리는 동안, 바미 기퍼 가써요]",

        explanation: "「-는 동안」表示某個動作持續進行的時間背景（當……的時候）；而「-아/어 가다」接在動詞或形容詞後，表達狀態隨著時間推移「逐漸發展、漸漸加深」（깊다 深 → 깊어 가다 漸漸變深）。"
      },
      {
        id: "g5",
        badge: "文法 05",
        pattern: "-지 않고",
        title: "否定／方式副詞連接詞尾",
        formula: "動詞／形容詞詞幹 ＋ -지 않고 ＋ 後續動作",
        matchTexts: ["서두르지 않고"],
        exampleKr: "서두르지 않고 서로의 몸과 마음을 어루만지며 시간을 보냈어요.",
        examplePron: "[서두르지 안코 서로의 몸과 마으믈 어루만지며 시가늘 보내써요]",
        exampleZh: "沒有絲毫急躁地，輕撫著彼此的身體與心靈度過了時光。",
        explanation: "延續長否定結構「-지 않다」，將句尾換成連接詞尾 -고 變成「-지 않고」，意思為「沒有做某事而……／不……地」，用來修飾後方動作的進行方式（서두르다 急躁 → 서두르지 않고 不急躁地）。注意 발음 時 않고 的 ㅎ 與 ㄱ 結合送氣唸成 [안코]。"
      }
    ];

    // ==========================================
    // 2. 狀態管理與 UI 參考
    // ==========================================
    let showTranslation = true;
    let showPhonetic = true;
    let speechRate = 1.0;
    let isReadingAll = false;
    let currentSpeakingId = null;
    let activeVocabId = null;
    let activeGrammarId = null;

    const storyContainer = document.getElementById("story-container");
    const vocabGrid = document.getElementById("vocab-grid");
    const grammarGrid = document.getElementById("grammar-grid");
    const toastBox = document.getElementById("toast-box");
    const toastMessage = document.getElementById("toast-message");
    let toastTimer = null;

    function showToast(msg) {
      toastMessage.textContent = msg;
      toastBox.classList.remove("opacity-0");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastBox.classList.add("opacity-0");
      }, 2600);
    }

    // ==========================================
    // 3. 渲染故事段落與高亮詞彙／文法
    // ==========================================
    function highlightAnnotationsInText(text) {
      let result = text;

      // 先標記重點詞彙
      vocabList.forEach(item => {
        const spanTag = `<span class="vocab-highlight" data-vocab-id="${item.id}" title="單字解析：${item.term}">${item.matchText}</span>`;
        result = result.replace(item.matchText, spanTag);
      });

      // 再標記文法重點結構（避免與單字片段重疊）
      grammarList.forEach(gItem => {
        gItem.matchTexts.forEach(phrase => {
          const gTag = `<span class="grammar-highlight" data-grammar-id="${gItem.id}" title="${gItem.badge}：${gItem.pattern}">${phrase}</span>`;
          result = result.replace(phrase, gTag);
        });
      });

      return result;
    }

    function renderStory() {
      storyContainer.innerHTML = "";
      storyParagraphs.forEach((p, idx) => {
        const card = document.createElement("article");
        card.id = `para-card-${p.id}`;
        card.className = "bg-night-900/75 border border-slate-800/90 rounded-3xl p-5 sm:p-7 transition-all duration-300 backdrop-blur-sm shadow-xl";

        const highlightedKorean = highlightAnnotationsInText(p.korean);

        card.innerHTML = `
          <div class="flex items-center justify-between gap-3 mb-3.5">
            <span class="text-xs font-medium tracking-wider uppercase text-amber-400/75 bg-amber-400/10 px-2.5 py-1 rounded-lg">
              段落 0${idx + 1}
            </span>
            <button
              type="button"
              class="speak-para-btn flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-medium bg-night-800 hover:bg-amber-400/20 text-slate-300 hover:text-amber-200 border border-slate-700/70 hover:border-amber-400/40 transition-all"
              data-para-id="${p.id}"
            >
              <span>🔊</span>
              <span>朗讀本段</span>
            </button>
          </div>

          <!-- 韓文原文 -->
          <p class="font-kr text-lg sm:text-xl leading-loose text-slate-100 font-normal tracking-wide mb-3">
            ${highlightedKorean}
          </p>

          <!-- 口語連音發音提示 -->
          <div class="phonetic-block ${showPhonetic ? "" : "hidden"} mt-3 pt-3 border-t border-slate-800/80">
            <div class="flex items-start gap-2 text-xs sm:text-sm text-rose-200/85 font-kr leading-relaxed">
              <span class="shrink-0 text-[11px] bg-rose-400/15 text-rose-300 border border-rose-400/30 px-2 py-0.5 rounded-md mt-0.5">連音</span>
              <span>${p.phonetic}</span>
            </div>
          </div>

          <!-- 繁體中文翻譯 -->
          <div class="translation-block ${showTranslation ? "" : "hidden"} mt-3 pt-3 border-t border-slate-800/80">
            <p class="text-sm sm:text-base text-slate-300/90 leading-relaxed font-light">
              ${p.translation}
            </p>
          </div>
        `;

        storyContainer.appendChild(card);
      });

      // 綁定單段朗讀按鈕
      document.querySelectorAll(".speak-para-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = Number(btn.getAttribute("data-para-id"));
          const target = storyParagraphs.find(item => item.id === id);
          if (target) {
            stopSpeech();
            speakText(target.korean, id);
          }
        });
      });

      // 綁定文內高亮單字點擊事件
      document.querySelectorAll(".vocab-highlight").forEach(span => {
        span.addEventListener("click", () => {
          const vocabId = span.getAttribute("data-vocab-id");
          focusVocabCard(vocabId);
        });
      });

      // 綁定文內高亮文法點擊事件
      document.querySelectorAll(".grammar-highlight").forEach(span => {
        span.addEventListener("click", () => {
          const grammarId = span.getAttribute("data-grammar-id");
          focusGrammarCard(grammarId);
        });
      });
    }

    // ==========================================
    // 4. 渲染單字卡、文法卡與互動聚焦
    // ==========================================
    function renderVocabCards() {
      vocabGrid.innerHTML = "";
      vocabList.forEach(item => {
        const card = document.createElement("div");
        card.id = `vocab-card-${item.id}`;
        card.className = "vocab-card-item cursor-pointer bg-night-800/75 hover:bg-night-800 border border-slate-700/60 rounded-2xl p-4 transition-all duration-200";
        card.innerHTML = `
          <div class="flex items-start justify-between gap-2 mb-1.5">
            <div>
              <h3 class="font-kr text-base sm:text-lg font-bold text-amber-200">${item.term}</h3>
              <p class="font-kr text-xs text-rose-300 mt-0.5">${item.pronunciation}</p>
            </div>
            <button type="button" class="vocab-audio-btn p-2 rounded-xl bg-night-950/80 hover:bg-amber-400/20 text-amber-300 border border-slate-700/60 text-xs transition-colors" title="聆聽單字發音">
              🔊
            </button>
          </div>
          <p class="text-sm font-medium text-slate-100 mt-2">${item.meaning}</p>
          <div class="mt-2.5 pt-2.5 border-t border-slate-700/50">
            <span class="inline-block text-[11px] text-amber-300/90 bg-amber-400/10 px-2 py-0.5 rounded mb-1">${item.rule}</span>
            <p class="text-xs text-slate-400 leading-relaxed">${item.detail}</p>
          </div>
        `;

        // 點擊卡片發音並高亮
        card.addEventListener("click", () => {
          highlightActiveVocab(item.id);
          stopSpeech();
          speakText(item.term, null);
        });

        vocabGrid.appendChild(card);
      });
    }

    function highlightActiveVocab(vocabId) {
      activeVocabId = vocabId;
      document.querySelectorAll(".vocab-card-item").forEach(c => {
        c.classList.remove("border-amber-400", "ring-2", "ring-amber-400/30", "bg-night-800");
        c.classList.add("border-slate-700/60");
      });
      document.querySelectorAll(".vocab-highlight").forEach(s => {
        s.classList.remove("active");
      });

      const targetCard = document.getElementById(`vocab-card-${vocabId}`);
      if (targetCard) {
        targetCard.classList.remove("border-slate-700/60");
        targetCard.classList.add("border-amber-400", "ring-2", "ring-amber-400/30", "bg-night-800");
      }

      const targetSpan = document.querySelector(`.vocab-highlight[data-vocab-id="${vocabId}"]`);
      if (targetSpan) {
        targetSpan.classList.add("active");
      }
    }

    function focusVocabCard(vocabId) {
      // 切換到單字頁籤
      switchTab("vocab");
      highlightActiveVocab(vocabId);
      const targetCard = document.getElementById(`vocab-card-${vocabId}`);
      if (targetCard) {
        targetCard.scrollIntoView({ behavior: "smooth", block: "center" });
      }
      const item = vocabList.find(v => v.id === vocabId);
      if (item) {
        stopSpeech();
        speakText(item.term, null);
      }
    }

    function renderGrammarCards() {
      grammarGrid.innerHTML = "";
      grammarList.forEach(item => {
        const card = document.createElement("div");
        card.id = `grammar-card-${item.id}`;
        card.className = "grammar-card-item bg-night-800/75 border border-slate-700/60 rounded-2xl p-4 sm:p-5 transition-all duration-200";
        card.innerHTML = `
          <div class="flex flex-wrap items-center justify-between gap-2 mb-2.5">
            <div class="flex flex-wrap items-center gap-2">
              <span class="text-xs font-bold tracking-wide px-2.5 py-1 rounded-lg bg-rose-500/20 text-rose-300 border border-rose-400/30">
                ${item.badge}
              </span>
              <span class="font-kr text-base sm:text-lg font-bold text-amber-200">
                ${item.pattern}
              </span>
              <span class="text-sm sm:text-base font-medium text-slate-100">
                ${item.title}
              </span>
            </div>
            <button
              type="button"
              class="grammar-audio-btn flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-medium bg-night-950/90 hover:bg-rose-400/20 text-rose-200 border border-slate-700/70 hover:border-rose-400/40 transition-all"
              data-grammar-id="${item.id}"
            >
              <span>🔊</span>
              <span>聆聽例句</span>
            </button>
          </div>

          <!-- 句型公式 -->
          <div class="text-xs text-amber-300/90 bg-night-950/75 border border-slate-800 rounded-xl px-3 py-2 mb-3 font-kr">
            <span class="text-slate-400 font-tc mr-1.5">句型公式：</span>${item.formula}
          </div>

          <!-- 故事原句範例 -->
          <div class="bg-night-900/90 border-l-2 border-rose-400/70 rounded-r-xl p-3 mb-3">
            <p class="font-kr text-sm sm:text-base text-slate-100 leading-relaxed">${item.exampleKr}</p>
            <p class="font-kr text-xs text-rose-300/90 mt-1">${item.examplePron}</p>
            <p class="text-xs sm:text-sm text-slate-300 mt-1">${item.exampleZh}</p>
          </div>

          <!-- 詳細文法解析 -->
          <p class="text-xs sm:text-sm text-slate-300/90 leading-relaxed">
            ${item.explanation}
          </p>
        `;

        const audioBtn = card.querySelector(".grammar-audio-btn");
        audioBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          highlightActiveGrammar(item.id);
          stopSpeech();
          speakText(item.exampleKr, null);
        });

        card.addEventListener("click", () => {
          highlightActiveGrammar(item.id);
        });

        grammarGrid.appendChild(card);
      });
    }

    function highlightActiveGrammar(grammarId) {
      activeGrammarId = grammarId;
      document.querySelectorAll(".grammar-card-item").forEach(c => {
        c.classList.remove("border-rose-400", "ring-2", "ring-rose-400/30", "bg-night-800");
        c.classList.add("border-slate-700/60");
      });
      document.querySelectorAll(".grammar-highlight").forEach(s => {
        s.classList.remove("active");
      });

      const targetCard = document.getElementById(`grammar-card-${grammarId}`);
      if (targetCard) {
        targetCard.classList.remove("border-slate-700/60");
        targetCard.classList.add("border-rose-400", "ring-2", "ring-rose-400/30", "bg-night-800");
      }

      document.querySelectorAll(`.grammar-highlight[data-grammar-id="${grammarId}"]`).forEach(span => {
        span.classList.add("active");
      });
    }

    function focusGrammarCard(grammarId) {
      switchTab("grammar");
      highlightActiveGrammar(grammarId);
      const targetCard = document.getElementById(`grammar-card-${grammarId}`);
      if (targetCard) {
        targetCard.scrollIntoView({ behavior: "smooth", block: "center" });
      }
      const item = grammarList.find(g => g.id === grammarId);
      if (item) {
        stopSpeech();
        speakText(item.exampleKr, null);
      }
    }

    // ==========================================
    // 5. Web Speech API 韓語語音朗讀功能
    // ==========================================
    function clearSpeakingVisuals() {
      document.querySelectorAll("article").forEach(el => {
        el.classList.remove("paragraph-speaking");
      });
      currentSpeakingId = null;
    }

    function stopSpeech() {
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
      isReadingAll = false;
      updateReadAllButton(false);
      clearSpeakingVisuals();
    }

    function updateReadAllButton(playing) {
      const icon = document.getElementById("read-all-icon");
      const text = document.getElementById("read-all-text");
      if (playing) {
        icon.textContent = "⏹️";
        text.textContent = "停止朗讀";
      } else {
        icon.textContent = "▶️";
        text.textContent = "朗讀全文";
      }
    }

    function speakText(text, paraId = null, onEndCallback = null) {
      if (!("speechSynthesis" in window)) {
        showToast("您的瀏覽器不支援語音朗讀功能，建議使用 Chrome 或 Safari。");
        return;
      }

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "ko-KR";
      utterance.rate = speechRate;
      utterance.pitch = 1.0;

      // 嘗試挑選較自然的韓語語音
      const voices = window.speechSynthesis.getVoices();
      const koVoice = voices.find(v => v.lang.includes("ko") && (v.name.includes("Google") || v.name.includes("Yuna") || v.name.includes("Natural")))
                   || voices.find(v => v.lang.includes("ko"));
      if (koVoice) {
        utterance.voice = koVoice;
      }

      utterance.onstart = () => {
        clearSpeakingVisuals();
        if (paraId) {
          currentSpeakingId = paraId;
          const card = document.getElementById(`para-card-${paraId}`);
          if (card) {
            card.classList.add("paragraph-speaking");
          }
        }
      };

      utterance.onend = () => {
        clearSpeakingVisuals();
        if (onEndCallback) onEndCallback();
      };

      utterance.onerror = () => {
        clearSpeakingVisuals();
        if (isReadingAll) {
          isReadingAll = false;
          updateReadAllButton(false);
        }
      };

      window.speechSynthesis.speak(utterance);
    }

    function readFullStory(index = 0) {
      if (index >= storyParagraphs.length) {
        isReadingAll = false;
        updateReadAllButton(false);
        clearSpeakingVisuals();
        showToast("全文朗讀完畢 ✨");
        return;
      }

      isReadingAll = true;
      updateReadAllButton(true);
      const p = storyParagraphs[index];
      const card = document.getElementById(`para-card-${p.id}`);
      if (card) {
        card.scrollIntoView({ behavior: "smooth", block: "center" });
      }

      speakText(p.korean, p.id, () => {
        if (isReadingAll) {
          setTimeout(() => readFullStory(index + 1), 450);
        }
      });
    }

    // ==========================================
    // 6. 控制列與頁籤事件監聽
    // ==========================================
    const toggleTranslationBtn = document.getElementById("toggle-translation");
    const togglePhoneticBtn = document.getElementById("toggle-phonetic");
    const speedSlowBtn = document.getElementById("speed-slow");
    const speedNormalBtn = document.getElementById("speed-normal");
    const readAllBtn = document.getElementById("read-all-btn");

    toggleTranslationBtn.addEventListener("click", () => {
      showTranslation = !showTranslation;
      document.querySelectorAll(".translation-block").forEach(el => {
        el.classList.toggle("hidden", !showTranslation);
      });
      toggleTranslationBtn.classList.toggle("opacity-50", !showTranslation);
      showToast(showTranslation ? "已顯示繁體中文翻譯" : "已隱藏繁體中文翻譯");
    });

    togglePhoneticBtn.addEventListener("click", () => {
      showPhonetic = !showPhonetic;
      document.querySelectorAll(".phonetic-block").forEach(el => {
        el.classList.toggle("hidden", !showPhonetic);
      });
      togglePhoneticBtn.classList.toggle("opacity-50", !showPhonetic);
      showToast(showPhonetic ? "已顯示口語連音提示" : "已隱藏口語連音提示");
    });

    speedSlowBtn.addEventListener("click", () => {
      speechRate = 0.8;
      speedSlowBtn.className = "px-2.5 py-1 rounded-lg bg-amber-400/25 text-amber-200 font-medium transition-colors";
      speedNormalBtn.className = "px-2.5 py-1 rounded-lg text-slate-400 hover:text-white transition-colors";
      showToast("朗讀語速已調整為 0.8x（慢速清晰）");
    });

    speedNormalBtn.addEventListener("click", () => {
      speechRate = 1.0;
      speedNormalBtn.className = "px-2.5 py-1 rounded-lg bg-amber-400/25 text-amber-200 font-medium transition-colors";
      speedSlowBtn.className = "px-2.5 py-1 rounded-lg text-slate-400 hover:text-white transition-colors";
      showToast("朗讀語速已調整為 1.0x（正常語速）");
    });

    readAllBtn.addEventListener("click", () => {
      if (isReadingAll) {
        stopSpeech();
        showToast("已停止朗讀");
      } else {
        stopSpeech();
        readFullStory(0);
      }
    });

    // 底部頁籤切換
    const tabVocab = document.getElementById("tab-vocab");
    const tabGrammar = document.getElementById("tab-grammar");
    const panelVocab = document.getElementById("panel-vocab");
    const panelGrammar = document.getElementById("panel-grammar");

    function switchTab(tab) {
      if (tab === "vocab") {
        panelVocab.classList.remove("hidden");
        panelGrammar.classList.add("hidden");
        tabVocab.className = "px-4 py-2 rounded-xl text-sm font-medium bg-amber-400/20 text-amber-200 border border-amber-400/40 transition-all";
        tabGrammar.className = "px-4 py-2 rounded-xl text-sm font-medium text-slate-400 hover:text-slate-200 border border-transparent transition-all";
      } else {
        panelGrammar.classList.remove("hidden");
        panelVocab.classList.add("hidden");
        tabGrammar.className = "px-4 py-2 rounded-xl text-sm font-medium bg-rose-400/20 text-rose-200 border border-rose-400/40 transition-all";
        tabVocab.className = "px-4 py-2 rounded-xl text-sm font-medium text-slate-400 hover:text-slate-200 border border-transparent transition-all";
      }
    }

    tabVocab.addEventListener("click", () => switchTab("vocab"));
    tabGrammar.addEventListener("click", () => switchTab("grammar"));

    // ==========================================
    // 7. 深夜細雨背景動畫（Canvas）
    // ==========================================
    function initRainEffect() {
      const canvas = document.getElementById("rain-canvas");
      const ctx = canvas.getContext("2d");
      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      const dropCount = Math.min(85, Math.floor(width / 16));
      const drops = Array.from({ length: dropCount }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        len: 12 + Math.random() * 18,
        speed: 2.5 + Math.random() * 3.5,
        opacity: 0.12 + Math.random() * 0.25
      }));

      window.addEventListener("resize", () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      function animateRain() {
        ctx.clearRect(0, 0, width, height);
        ctx.lineWidth = 1;
        ctx.lineCap = "round";

        drops.forEach(d => {
          ctx.strokeStyle = `rgba(203, 213, 225, ${d.opacity})`;
          ctx.beginPath();
          ctx.moveTo(d.x, d.y);
          ctx.lineTo(d.x - 1.5, d.y + d.len);
          ctx.stroke();

          d.y += d.speed;
          d.x -= 0.4;

          if (d.y > height) {
            d.y = -d.len;
            d.x = Math.random() * width;
          }
          if (d.x < 0) {
            d.x = width;
          }
        });

        requestAnimationFrame(animateRain);
      }

      animateRain();
    }

    // 確保語音列表預載
    if ("speechSynthesis" in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }

    // 初始化頁面
    window.addEventListener("DOMContentLoaded", () => {
      renderStory();
      renderVocabCards();
      renderGrammarCards();
      initRainEffect();
    });
  </script>
</body>
</html>
